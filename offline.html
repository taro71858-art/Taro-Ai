<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Офлайн режим — CoreMaX AI</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #07090e;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #0e131f;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 16px;
      padding: 24px;
      max-width: 380px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon { font-size: 3rem; margin-bottom: 12px; }
    h1 { font-size: 1.25rem; color: #f59e0b; margin: 0 0 8px 0; font-weight: 800; }
    p { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; margin: 0 0 20px 0; }
    .btn {
      background: linear-gradient(135deg, #fde047 0%, #f59e0b 50%, #d97706 100%);
      color: #07090e;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Нет интернет-соединения</h1>
    <p>Приложение CoreMaX AI перешло в автономный режим. Сохранённые расчеты и локальные калькуляторы остаются доступными.</p>
    <button type="button" class="btn" onclick="window.location.reload()">🔄 Проверить сеть и обновить</button>
  </div>
</body>
</html>
